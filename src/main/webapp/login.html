<!DOCTYPE html>

<html>

<head>
    <title>TradeForge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="box">

    <h1>TRADEFORGE</h1>

    <p>Stock Trading System</p>

    <form action="login" method="post">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            LOGIN
        </button>

    </form>

</div>

</body>

</html>
